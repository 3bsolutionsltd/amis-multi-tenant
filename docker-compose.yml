services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amis
      POSTGRES_PASSWORD: amis
      POSTGRES_DB: amis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
