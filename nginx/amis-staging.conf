# ── AMIS Staging Nginx Virtual Hosts ─────────────────────────────────────────
# Place this file at: /etc/nginx/sites-available/amis-staging.conf
# Enable with:        ln -s /etc/nginx/sites-available/amis-staging.conf /etc/nginx/sites-enabled/
# Test with:          nginx -t
# Reload with:        systemctl reload nginx
#
# Domains:
#   pre.amis.institute       → AMIS staging web frontend  (Docker: localhost:8096)
#   api.pre.amis.institute   → AMIS staging Fastify API   (Docker: localhost:3002)
#
# DNS: Add A records for pre.amis.institute and api.pre.amis.institute
#      pointing to the same VPS IP as amis.institute.
#
# TLS certificates — run ONCE after DNS propagates:
#   certbot --nginx -d pre.amis.institute -d api.pre.amis.institute
# Certbot will rewrite the ssl_certificate lines and add HTTPS redirect blocks.
# ─────────────────────────────────────────────────────────────────────────────

# ── Frontend: pre.amis.institute ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pre.amis.institute;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass         http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── API: api.pre.amis.institute ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.pre.amis.institute;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# NOTE: HTTPS server blocks are added automatically by certbot.
# After running: certbot --nginx -d pre.amis.institute -d api.pre.amis.institute
# certbot will append the 443 server blocks with ssl_certificate lines.
