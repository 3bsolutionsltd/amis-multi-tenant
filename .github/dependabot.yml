version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # @fastify/* plugins require matching Fastify major version.
      # Do not auto-bump major versions until Fastify core is upgraded to v5.
      - dependency-name: "@fastify/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "github-actions"
