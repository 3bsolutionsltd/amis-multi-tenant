services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-amis}
    volumes:
      - pgdata_online:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amis} -d ${POSTGRES_DB:-amis}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_online:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    image: ${AMIS_IMAGE_REGISTRY:-ghcr.io/3bsolutionsltd}/amis-api:${AMIS_VERSION:?required}
    environment:
      NODE_ENV: production
      SELF_HOSTED_MODE: "true"
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-amis}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-amis}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      CORS_ORIGIN: ${CORS_ORIGIN:?required}
      APP_URL: ${APP_URL:?required}
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-AMIS <noreply@amis.institute>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-AMIS <noreply@amis.institute>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - "0.0.0.0:3001:3000"
    volumes:
      - uploads_online:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${AMIS_IMAGE_REGISTRY:-ghcr.io/3bsolutionsltd}/amis-web:${AMIS_VERSION:?required}
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ghcr.io/amacneil/dbmate:latest
    command: up
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-amis}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-amis}?sslmode=disable
    volumes:
      - ../db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata_online:
  uploads_online:
  redis_online: